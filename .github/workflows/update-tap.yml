name: Update Homebrew Tap
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to update (leave empty to fetch latest)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Get Release Info and Calculate Hash
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Prefer an explicitly supplied tag, then the release event, and
          # finally the current latest release for manual runs.
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$RELEASE_TAG"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$REPOSITORY" --json tagName --jq .tagName)
          fi

          echo "Using Tag: $TAG"
          VERSION="${TAG#v}"
          ASSET="VTPlayer_macOS_v${VERSION}.dmg"

          # Use the authenticated release API so private/rate-limited assets
          # and repository renames do not cause a silent 404/hash failure.
          gh release download "$TAG" --repo "$REPOSITORY" \
            --pattern "$ASSET" --output release.dmg
          SHA=$(shasum -a 256 release.dmg | awk '{print $1}')

          # Keep the cask requirement synchronized with the Xcode project.
          DEPLOYMENT_TARGETS=$(grep -E 'MACOSX_DEPLOYMENT_TARGET = [0-9.]+;' VTPlayer.xcodeproj/project.pbxproj \
            | sed -E 's/.*= ([0-9.]+);/\1/' | sort -u)
          if [ "$(printf '%s\n' "$DEPLOYMENT_TARGETS" | sed '/^$/d' | wc -l | tr -d ' ')" != "1" ]; then
            echo "Expected one macOS deployment target, found: $DEPLOYMENT_TARGETS" >&2
            exit 1
          fi
          MACOS_VERSION="$DEPLOYMENT_TARGETS"
          case "${MACOS_VERSION%%.*}" in
            26) MACOS_TOKEN="tahoe" ;;
            15) MACOS_TOKEN="sequoia" ;;
            14) MACOS_TOKEN="sonoma" ;;
            13) MACOS_TOKEN="ventura" ;;
            12) MACOS_TOKEN="monterey" ;;
            11) MACOS_TOKEN="big_sur" ;;
            *) echo "No Homebrew macOS token mapping for $MACOS_VERSION" >&2; exit 1 ;;
          esac

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "macos_token=$MACOS_TOKEN" >> $GITHUB_OUTPUT

      - name: Checkout Tap Repo
        uses: actions/checkout@v4
        with:
          repository: gitmichaelqiu/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Cask File
        env:
          VERSION: ${{ steps.info.outputs.version }}
          SHA: ${{ steps.info.outputs.sha }}
          MACOS_TOKEN: ${{ steps.info.outputs.macos_token }}
        run: |
          CASK_PATH="Casks/vtplayer.rb"
          mkdir -p "$(dirname "$CASK_PATH")"
          cat > "$CASK_PATH" <<EOF
          cask "vtplayer" do
            version "$VERSION"
            sha256 "$SHA"

            url "https://github.com/gitmichaelqiu/VTPlayer/releases/download/v#{version}/VTPlayer_macOS_v#{version}.dmg"
            name "VTPlayer"
            desc "Real-time video enhancement player for macOS"
            homepage "https://github.com/gitmichaelqiu/VTPlayer"

            livecheck do
              url :url
              strategy :github_latest
            end

            auto_updates true
            depends_on macos: ">= :$MACOS_TOKEN"

            app "VTPlayer.app"
          end
          EOF
          grep -q '^cask "vtplayer" do$' "$CASK_PATH"

      - name: Commit and Push to Tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/vtplayer.rb
          
          # Avoid failing if the version is already up to date
          if git diff --staged --quiet; then
            echo "No changes detected. Cask is already at version ${{ steps.info.outputs.version }}."
          else
            git commit -m "chore: update vtplayer to ${{ steps.info.outputs.version }}"
            git push origin HEAD
          fi
